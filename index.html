<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop — Feed</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0D">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0D;
    --ink: #F4F2ED;
    --ink-dim: rgba(244,242,237,0.68);
    --ink-faint: rgba(244,242,237,0.4);
    --signal: #FF8A1E;
    --teal: #2DD4BF;
    --panel: rgba(20,20,24,0.55);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; overscroll-behavior-y:none;
  }
  .num{ font-family:'Space Grotesk',sans-serif; font-weight:700; }

  /* ---------- Feed ---------- */
  .feed{
    height:100dvh; width:100%; overflow-y:scroll; scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{ display:none; }

  .slide{
    position:relative; height:100dvh; width:100%; scroll-snap-align:start;
    display:flex; align-items:flex-end; overflow:hidden; background:#000;
  }
  .slide video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(1.05);
  }
  .slide::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
  }

  /* watch-progress hairline, top of each slide — signature element */
  .progress-track{
    position:absolute; top:calc(env(safe-area-inset-top, 14px) + 46px);
    left:16px; right:16px; height:2px; border-radius:2px;
    background:rgba(244,242,237,0.18); overflow:hidden; z-index:5;
  }
  .progress-fill{
    height:100%; width:0%; background:var(--signal);
    transition:width .1s linear;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:6;
    padding:calc(env(safe-area-inset-top, 14px) + 10px) 16px 0;
    display:flex; align-items:center; justify-content:center; gap:26px;
  }
  .topbar button{
    background:none; border:none; color:var(--ink-faint); font-family:'Inter';
    font-size:15px; font-weight:600; padding:4px 0; cursor:pointer;
  }
  .topbar button.active{ color:var(--ink); position:relative; }
  .topbar button.active::after{
    content:''; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    width:18px; height:3px; border-radius:3px; background:var(--signal);
  }
  .logout-btn{
    position:fixed; top:calc(env(safe-area-inset-top, 14px) + 12px); right:16px; z-index:7;
    background:var(--panel); backdrop-filter:blur(6px); border:none; border-radius:20px;
    color:var(--ink-dim); font-size:12px; font-weight:500; padding:6px 12px; cursor:pointer;
  }

  /* ---------- Caption block ---------- */
  .meta{
    position:relative; z-index:4; padding:0 84px 24px 16px; width:100%;
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .handle{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .handle img{ width:34px; height:34px; border-radius:50%; object-fit:cover; border:1.5px solid var(--ink); }
  .handle span{ font-weight:600; font-size:15px; }
  .caption{ font-size:14.5px; line-height:1.4; color:var(--ink); max-width:78%; }
  .caption .tag{ color:var(--teal); }
  .sound{ display:flex; align-items:center; gap:6px; margin-top:10px; font-size:13px; color:var(--ink-dim); }

  /* ---------- Right action rail ---------- */
  .rail{
    position:absolute; right:12px; bottom:calc(28px + env(safe-area-inset-bottom, 0px));
    z-index:4; display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  .rail .avatar-wrap{ position:relative; margin-bottom:4px; }
  .rail .avatar-wrap img{ width:46px; height:46px; border-radius:50%; object-fit:cover; border:2px solid var(--ink); }
  .rail .avatar-wrap .plus{
    position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    width:20px; height:20px; border-radius:50%; background:var(--signal);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }
  .action{ display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; cursor:pointer; }
  .action .icon{
    width:46px; height:46px; border-radius:50%; background:var(--panel);
    backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .action.liked .icon{ background:rgba(255,138,30,0.18); }
  .action.liked .icon svg{ fill:var(--signal); stroke:var(--signal); }
  .action:active .icon{ transform:scale(0.88); }
  .action .count{ font-size:12.5px; color:var(--ink-dim); }
  svg{ width:24px; height:24px; stroke:var(--ink); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  /* double-tap heart burst */
  .burst{
    position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .burst svg{
    width:110px; height:110px; fill:var(--signal); stroke:none; opacity:0; transform:scale(0.4);
  }
  .burst.play svg{ animation:burstPop .7s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes burstPop{
    0%{ opacity:0; transform:scale(0.4) rotate(-6deg); }
    35%{ opacity:1; transform:scale(1.05) rotate(0deg); }
    70%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.15); }
  }

  /* mute indicator */
  .mute-hint{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:3; width:56px; height:56px; border-radius:50%; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none;
  }
  .mute-hint.show{ animation:hintFade 0.9s ease forwards; }
  @keyframes hintFade{ 0%{opacity:0} 15%{opacity:1} 80%{opacity:1} 100%{opacity:0} }

  /* ---------- Commentaires ---------- */
  .comments-overlay{
    position:fixed; inset:0; z-index:30; background:rgba(0,0,0,0.55);
    display:none; align-items:flex-end; justify-content:center;
  }
  .comments-overlay.show{ display:flex; }
  .comments-sheet{
    width:100%; max-width:480px; height:72dvh; background:#111116; border-radius:18px 18px 0 0;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .comments-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
    border-bottom:1px solid rgba(244,242,237,0.08); font-family:'Space Grotesk'; font-weight:700; font-size:14.5px;
  }
  .comments-head button{ background:none; border:none; color:var(--ink-dim); font-size:20px; cursor:pointer; }
  .comments-list{ flex:1; overflow-y:auto; padding:12px 16px; }
  .comment-row{ display:flex; gap:10px; margin-bottom:16px; }
  .comment-row img{ width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; background:#222; }
  .comment-body .handle{ font-size:12.5px; font-weight:600; color:var(--ink-dim); margin:0 0 2px; }
  .comment-body .text{ font-size:14px; line-height:1.4; }
  .comment-body .time{ font-size:11px; color:var(--ink-faint); margin-top:3px; }
  .comments-empty{ text-align:center; color:var(--ink-faint); font-size:13.5px; padding:30px 20px; }
  .comments-input-row{
    display:flex; gap:10px; align-items:center; padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid rgba(244,242,237,0.08);
  }
  .comments-input-row input{
    flex:1; padding:11px 14px; border-radius:20px; border:1px solid rgba(244,242,237,0.14);
    background:#1a1a20; color:var(--ink); font-family:'Inter'; font-size:14px; outline:none;
  }
  .comments-input-row input:focus{ border-color:var(--signal); }
  .comments-input-row button{
    background:var(--signal); border:none; color:#fff; font-weight:700; font-size:13px;
    padding:10px 16px; border-radius:20px; cursor:pointer; flex-shrink:0;
  }
  .comments-input-row button:disabled{ opacity:0.5; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:rgba(10,10,13,0.85); backdrop-filter:blur(14px);
    border-top:1px solid rgba(244,242,237,0.08);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .navitem{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-weight:500;
  }
  .navitem.active{ color:var(--ink); }
  .navitem.active svg{ stroke:var(--ink); }
  .navitem svg{ width:23px; height:23px; }
  .upload-btn{
    width:42px; height:32px; border-radius:9px; background:var(--signal);
    display:flex; align-items:center; justify-content:center; margin-top:-2px;
  }
  .upload-btn svg{ stroke:var(--bg); width:20px; height:20px; }

  /* hide feed scroll under bottom nav */
  .feed{ padding-bottom:0; }
</style>
</head>
<body>

<div class="feed" id="feed"></div>

<div class="comments-overlay" id="commentsOverlay">
  <div class="comments-sheet">
    <div class="comments-head">
      <span id="commentsCount">Commentaires</span>
      <button id="closeComments">✕</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comments-input-row">
      <input type="text" id="commentInput" placeholder="Ajoute un commentaire..." maxlength="300">
      <button id="sendComment">Publier</button>
    </div>
  </div>
</div>

<nav class="bottomnav">
  <button class="navitem active">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Accueil
  </button>
  <button class="navitem" onclick="window.location.href='discover.html'">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    Découvrir
  </button>
  <button class="navitem" onclick="window.location.href='upload.html'">
    <div class="upload-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  </button>
  <button class="navitem">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    Boîte
  </button>
  <button class="navitem" onclick="window.location.href='profile.html'">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    Profil
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ---- Connexion au projet Supabase "loop-mvp" (séparé du projet EtaChop) ---- */
const SUPABASE_URL = "https://rvauipnxvhluvmyaqwty.supabase.co";
const SUPABASE_KEY = "sb_publishable_dPzLd2Upx4_kpjh5HSb7xg_lLRXekKs";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let MOCK_VIDEOS = [];
let currentUser = null;
let likedVideoIds = new Set();
let soundOn = false;

async function requireAuth(){
  const { data } = await sb.auth.getSession();
  if(!data.session){
    window.location.href = 'auth.html';
    return false;
  }
  currentUser = data.session.user;
  return true;
}

async function loadVideos(){
  const { data, error } = await sb
    .from('videos')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    console.error('Erreur de chargement des vidéos:', error);
    feedEl.innerHTML = `<div style="color:#fff;padding:40px;text-align:center;">Impossible de charger le feed. Vérifie ta connexion.</div>`;
    return;
  }

  MOCK_VIDEOS = data.map(v => ({
    id: v.id,
    userId: v.user_id,
    src: v.video_url,
    user: v.display_name || 'utilisateur',
    avatar: v.avatar_url || 'https://i.pravatar.cc/100',
    caption: v.caption || '',
    sound: v.sound_label || 'Son original',
    likes: v.likes_count || 0,
    comments: v.comments_count || 0,
    shares: v.shares_count || 0
  }));

  if(currentUser){
    const { data: myLikes } = await sb
      .from('likes')
      .select('video_id')
      .eq('user_id', currentUser.id);
    likedVideoIds = new Set((myLikes || []).map(l => l.video_id));
  }

  renderFeed();
}

const heartIcon = `<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.4 2 4.5 5.7 4c2-.3 3.9.7 5 2.3C11.8 4.7 13.7 3.7 15.7 4c3.7.5 5.3 4.4 3.7 7.8C19.5 16.4 12 21 12 21z"/></svg>`;
const commentIcon = `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H8l-5 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>`;
const shareIcon = `<svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>`;
const downloadIcon = `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>`;

function fmt(n){
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return n;
}

const feedEl = document.getElementById('feed');
let io; // IntersectionObserver, recréé à chaque rendu

function renderFeed(){
  feedEl.innerHTML = '';

  MOCK_VIDEOS.forEach((v) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.dataset.videoId = v.id;
    slide.innerHTML = `
      <video src="${v.src}" loop muted playsinline preload="metadata"></video>
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="mute-hint"><svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:#fff"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></div>
      <div class="burst"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.4 2 4.5 5.7 4c2-.3 3.9.7 5 2.3C11.8 4.7 13.7 3.7 15.7 4c3.7.5 5.3 4.4 3.7 7.8C19.5 16.4 12 21 12 21z"/></svg></div>

      <div class="rail">
        <div class="avatar-wrap"${v.userId ? ` style="cursor:pointer" onclick="window.location.href='profile.html?id=${v.userId}'"` : ''}>
          <img src="${v.avatar}" alt="">
          <div class="plus">+</div>
        </div>
        <button class="action like-btn${likedVideoIds.has(v.id) ? ' liked' : ''}">
          <div class="icon">${heartIcon}</div>
          <span class="count like-count" data-raw="${v.likes}">${fmt(v.likes)}</span>
        </button>
        <button class="action comment-btn">
          <div class="icon">${commentIcon}</div>
          <span class="count comment-count" data-raw="${v.comments}">${fmt(v.comments)}</span>
        </button>
        <button class="action">
          <div class="icon">${shareIcon}</div>
          <span class="count">${fmt(v.shares)}</span>
        </button>
        <button class="action download-btn" data-src="${v.src}" data-user="${v.user}">
          <div class="icon">${downloadIcon}</div>
          <span class="count">Save</span>
        </button>
      </div>

      <div class="meta">
        <div class="handle"${v.userId ? ` style="cursor:pointer" onclick="window.location.href='profile.html?id=${v.userId}'"` : ''}><img src="${v.avatar}" alt=""><span>@${v.user}</span></div>
        <div class="caption">${v.caption}</div>
        <div class="sound">🎵 ${v.sound}</div>
      </div>
    `;
    feedEl.appendChild(slide);
  });

  if(!document.querySelector('.topbar')){
    const topbar = document.createElement('div');
    topbar.className = 'topbar';
    topbar.style.position = 'fixed';
    topbar.innerHTML = `
      <button>Abonnements</button>
      <button class="active">Pour toi</button>
    `;
    document.body.appendChild(topbar);

    const logoutBtn = document.createElement('button');
    logoutBtn.className = 'logout-btn';
    logoutBtn.textContent = 'Déconnexion';
    logoutBtn.addEventListener('click', async ()=>{
      await sb.auth.signOut();
      window.location.href = 'auth.html';
    });
    document.body.appendChild(logoutBtn);
  }

  wireUpFeed();

  const targetId = new URLSearchParams(window.location.search).get('v');
  if(targetId){
    const targetSlide = document.querySelector(`.slide[data-video-id="${targetId}"]`);
    if(targetSlide) targetSlide.scrollIntoView({ behavior:'instant', block:'start' });
  }
}

function wireUpFeed(){
  const slides = document.querySelectorAll('.slide');
  const videos = document.querySelectorAll('.slide video');

  videos.forEach(vid => { vid.muted = !soundOn; });

  if(io) io.disconnect();
  io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const vid = entry.target.querySelector('video');
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        vid.muted = !soundOn;
        vid.play().catch(()=>{});
      } else {
        vid.pause();
      }
    });
  }, { threshold: [0.6] });
  slides.forEach(s => io.observe(s));

  videos.forEach(vid=>{
    const fill = vid.closest('.slide').querySelector('.progress-fill');
    vid.addEventListener('timeupdate', ()=>{
      if(vid.duration){
        fill.style.width = (vid.currentTime / vid.duration * 100) + '%';
      }
    });
  });

  let lastTap = 0;
  slides.forEach(slide=>{
    const vid = slide.querySelector('video');
    const hint = slide.querySelector('.mute-hint');
    const burst = slide.querySelector('.burst');
    const likeBtn = slide.querySelector('.like-btn');

    slide.addEventListener('click', (e)=>{
      if(e.target.closest('.rail') || e.target.closest('.bottomnav')) return;
      const now = Date.now();
      if(now - lastTap < 300){
        if(!likeBtn.classList.contains('liked')) triggerLike(slide, likeBtn);
        burst.classList.remove('play'); void burst.offsetWidth; burst.classList.add('play');
      } else {
        setTimeout(()=>{
          if(Date.now() - lastTap >= 300){
            soundOn = !soundOn;
            videos.forEach(v => { v.muted = !soundOn; });
            hint.classList.remove('show'); void hint.offsetWidth; hint.classList.add('show');
          }
        }, 300);
      }
      lastTap = now;
    });

    likeBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      triggerLike(slide, likeBtn);
    });

    const commentBtn = slide.querySelector('.comment-btn');
    commentBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openComments(slide.dataset.videoId);
    });

    const downloadBtn = slide.querySelector('.download-btn');
    downloadBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      downloadWithWatermark(downloadBtn.dataset.src, downloadBtn.dataset.user, slide.dataset.videoId, downloadBtn);
    });
  });

  document.body.addEventListener('click', function unmuteFirst(){
    soundOn = true;
    videos.forEach(v => { v.muted = false; });
    document.body.removeEventListener('click', unmuteFirst);
  }, { once:true });
}

/* ---- Like / unlike réel, lié au compte connecté, persisté dans la table `likes` ---- */
async function triggerLike(slide, btn){
  const videoId = slide.dataset.videoId;
  const countEl = btn.querySelector('.count');
  const alreadyLiked = btn.classList.contains('liked');

  // Mise à jour optimiste de l'UI
  const rawCount = parseInt(countEl.dataset.raw || countEl.textContent.replace('k','')) || 0;
  const nextCount = alreadyLiked ? Math.max(rawCount - 1, 0) : rawCount + 1;
  countEl.dataset.raw = nextCount;
  countEl.textContent = fmt(nextCount);
  btn.classList.toggle('liked', !alreadyLiked);

  if(alreadyLiked){
    likedVideoIds.delete(videoId);
    await sb.from('likes').delete().eq('user_id', currentUser.id).eq('video_id', videoId);
  } else {
    likedVideoIds.add(videoId);
    const { error } = await sb.from('likes').insert({ user_id: currentUser.id, video_id: videoId });
    if(error && error.code !== '23505'){ // ignore "déjà liké" en cas de double-clic rapide
      console.error('Erreur like:', error);
    }
  }
}

/* ---- Commentaires : chargement + publication en direct ---- */
const commentsOverlay = document.getElementById('commentsOverlay');
const commentsList = document.getElementById('commentsList');
const commentsCountEl = document.getElementById('commentsCount');
const commentInput = document.getElementById('commentInput');
const sendCommentBtn = document.getElementById('sendComment');
let activeVideoId = null;

function timeAgo(dateStr){
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if(diff < 60) return "à l'instant";
  if(diff < 3600) return Math.floor(diff/60) + 'min';
  if(diff < 86400) return Math.floor(diff/3600) + 'h';
  return Math.floor(diff/86400) + 'j';
}

async function openComments(videoId){
  activeVideoId = videoId;
  commentsOverlay.classList.add('show');
  commentsList.innerHTML = '<div class="comments-empty">Chargement...</div>';
  await loadComments(videoId);
}

async function loadComments(videoId){
  const { data, error } = await sb
    .from('comments')
    .select('id, content, created_at, profiles(username, avatar_url)')
    .eq('video_id', videoId)
    .order('created_at', { ascending:true });

  if(error){
    commentsList.innerHTML = '<div class="comments-empty">Impossible de charger les commentaires.</div>';
    return;
  }

  commentsCountEl.textContent = data.length + (data.length > 1 ? ' commentaires' : ' commentaire');

  if(data.length === 0){
    commentsList.innerHTML = '<div class="comments-empty">Aucun commentaire pour l\'instant. Sois le premier à réagir.</div>';
    return;
  }

  commentsList.innerHTML = data.map(c => `
    <div class="comment-row">
      <img src="${c.profiles?.avatar_url || 'https://i.pravatar.cc/64?u=' + c.id}" alt="">
      <div class="comment-body">
        <p class="handle">@${c.profiles?.username || 'utilisateur'}</p>
        <p class="text">${escapeHtml(c.content)}</p>
        <p class="time">${timeAgo(c.created_at)}</p>
      </div>
    </div>
  `).join('');
  commentsList.scrollTop = commentsList.scrollHeight;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('closeComments').addEventListener('click', ()=>{
  commentsOverlay.classList.remove('show');
  activeVideoId = null;
});

async function submitComment(){
  const text = commentInput.value.trim();
  if(!text || !activeVideoId || !currentUser) return;
  sendCommentBtn.disabled = true;

  const { error } = await sb.from('comments').insert({
    video_id: activeVideoId,
    user_id: currentUser.id,
    content: text
  });

  sendCommentBtn.disabled = false;
  if(error){ console.error('Erreur commentaire:', error); return; }

  commentInput.value = '';
  await loadComments(activeVideoId);

  // Met à jour le compteur affiché sous l'icône commentaire dans le feed
  const slide = document.querySelector(`.slide[data-video-id="${activeVideoId}"]`);
  if(slide){
    const countEl = slide.querySelector('.comment-count');
    const current = parseInt(countEl.dataset.raw || countEl.textContent) || 0;
    countEl.dataset.raw = current + 1;
    countEl.textContent = fmt(current + 1);
  }
}
sendCommentBtn.addEventListener('click', submitComment);
commentInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submitComment(); });

/* ---- Téléchargement avec filigrane Loop animé (icône qui rebondit + pseudo) ---- */
const watermarkImg = new Image();
watermarkImg.src = 'assets/watermark-mark.png';

function downloadWithWatermark(src, username, videoId, btn){
  const countEl = btn.querySelector('.count');
  const originalLabel = countEl.textContent;
  btn.disabled = true;
  countEl.textContent = '...';

  const exportVideo = document.createElement('video');
  exportVideo.crossOrigin = 'anonymous';
  exportVideo.muted = true; // reste muet pour éviter le blocage autoplay — l'audio est quand même capturé via captureStream()
  exportVideo.playsInline = true;
  exportVideo.src = src;

  const safetyTimeout = setTimeout(()=>{
    alert("Le chargement de la vidéo prend trop de temps ou a échoué. Vérifie ta connexion et réessaie.");
    btn.disabled = false;
    countEl.textContent = originalLabel;
  }, 12000);

  exportVideo.onloadedmetadata = async ()=>{
    clearTimeout(safetyTimeout);
    try{
      const MAX_H = 960;
      const scale = Math.min(1, MAX_H / exportVideo.videoHeight);
      const w = Math.round(exportVideo.videoWidth * scale);
      const h = Math.round(exportVideo.videoHeight * scale);

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');

      if(typeof exportVideo.captureStream !== 'function'){
        throw new Error("Ton navigateur ne supporte pas le téléchargement avec filigrane.");
      }

      const canvasStream = canvas.captureStream(30);
      const fullStream = exportVideo.captureStream();
      fullStream.getAudioTracks().forEach(t => canvasStream.addTrack(t));

      let mimeType = 'video/webm;codecs=vp9,opus';
      if(!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp8,opus';
      if(!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

      const recorder = new MediaRecorder(canvasStream, { mimeType, videoBitsPerSecond: 3_000_000 });
      const chunks = [];
      recorder.ondataavailable = (e)=>{ if(e.data.size>0) chunks.push(e.data); };

      const iconSize = w * 0.14;
      let px = w * 0.15, py = h * 0.2;
      let vx = w * 0.16, vy = h * 0.14; // vitesse en px/seconde
      let lastT = null;

      function drawWatermark(now){
        if(lastT === null) lastT = now;
        const dt = (now - lastT) / 1000;
        lastT = now;

        px += vx * dt; py += vy * dt;
        if(px <= 0 || px + iconSize >= w){ vx *= -1; px = Math.max(0, Math.min(px, w-iconSize)); }
        if(py <= 0 || py + iconSize >= h){ vy *= -1; py = Math.max(0, Math.min(py, h-iconSize)); }

        ctx.drawImage(exportVideo, 0, 0, w, h);

        if(watermarkImg.complete && watermarkImg.naturalWidth){
          ctx.globalAlpha = 0.9;
          const ratio = watermarkImg.naturalWidth / watermarkImg.naturalHeight;
          const iw = iconSize, ih = iconSize / ratio;
          ctx.drawImage(watermarkImg, px, py, iw, ih);
          ctx.globalAlpha = 1;
        }

        // pseudo en filigrane bas de l'écran
        const label = `@${username} · Loop`;
        ctx.font = `${Math.round(h*0.032)}px sans-serif`;
        const tw = ctx.measureText(label).width;
        const padX = h*0.018, padY = h*0.012;
        const bx = h*0.03, by = h - h*0.09;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        roundRect(ctx, bx, by, tw+padX*2, h*0.045+padY, (h*0.045)/2);
        ctx.fillStyle = '#fff';
        ctx.fillText(label, bx+padX, by + h*0.045*0.72);
      }

      function roundRect(ctx,x,y,w,h,r){
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.arcTo(x+w,y,x+w,y+h,r);
        ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r);
        ctx.arcTo(x,y,x+w,y,r);
        ctx.closePath();
        ctx.fill();
      }

      let rafId;
      function loop(now){
        drawWatermark(now);
        rafId = requestAnimationFrame(loop);
      }

      recorder.onstop = ()=>{
        cancelAnimationFrame(rafId);
        const blob = new Blob(chunks, { type:'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `loop-${username}-${videoId}.webm`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=> URL.revokeObjectURL(url), 3000);
        btn.disabled = false;
        countEl.textContent = originalLabel;
      };

      exportVideo.onended = ()=> recorder.stop();

      recorder.start();
      exportVideo.currentTime = 0;
      await exportVideo.play();
      rafId = requestAnimationFrame(loop);

    } catch(err){
      console.error('Erreur export vidéo:', err);
      const tainted = err.name === 'SecurityError' || /tainted|cross-origin/i.test(err.message||'');
      alert(tainted
        ? "Cette vidéo ne peut pas être téléchargée (vidéo de démonstration externe). Ça marchera avec les vraies vidéos publiées sur Loop."
        : "Le téléchargement a échoué. Réessaie.");
      btn.disabled = false;
      countEl.textContent = originalLabel;
    }
  };

  exportVideo.onerror = ()=>{
    clearTimeout(safetyTimeout);
    alert("Impossible de charger cette vidéo pour le téléchargement.");
    btn.disabled = false;
    countEl.textContent = originalLabel;
  };
}

  const ok = await requireAuth();
  if(ok) loadVideos();
})();
